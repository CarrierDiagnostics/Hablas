<!DOCTYPE html>
<html lang=""en">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
<style>
    body {
        margin: 20px;
        }
    #input_sentence {
        
        margin-top:20px;
        
    }
    div {
        padding: 2%;
    }
    #wrong {
        color: red;
    }
    #viewer {
        width: 100%;
        height: 600px;
        border: 1px solid #ccc;
        overflow: auto;
    }

    #record {
        margin-top: 10px;
        padding: 5px; /*changes size of the button*/
        display: block;
        flex:1;
    }

    #stop {
        margin-top: 10px;
        padding: 5px; /*changes size of the button*/
        display: block;
        flex:1;
    }
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.4);
    }
    .modal-content {
        position: relative; /* Makes this element a positioning context for its children
        Any child with position: absolute will be positioned relative to this element
        Like creating a coordinate system inside this element */
        height: 400px;
        display: flex;
        flex-direction: column;
        /* Makes flex items stack vertically instead of horizontally*/
        background-color: #fefefe;
        margin: 15% auto;
        padding: 20px;
        border: 1px solid #888;
        width: 80%;
    }
    .close {
        float: right;
        cursor: pointer;
    }
    .arrow-container {
        /*is position: absolute; */
        flex:1; 
        bottom: 20px; /* 20px from bottom of modal-content (parent) */
        left: 0;
        right: 0;
        display: flex; /* Makes items inside lay out horizontally */
        justify-content: center;
        gap: 10px; /*adds 10 px of space between the arrows*/
        padding: 10px;
        background-color: white;
    }
    .arrowPrev, .arrowNext {
        cursor: pointer;    /* Changes mouse cursor to a hand when hovering */
        padding: 5px 10px;  /* Adds space inside each arrow (5px top/bottom, 10px left/right) */
    }
    .text-container {
        flex: 9; /* Takes up all available space in the flex container */
        overflow-y: auto; /* Adds vertical scroll when content is too tall */
        padding: 20px;
        margin-bottom: 60px;
    }
</style>
<body>
    <h1>Hablas Trial</h1>
    
     <!-- EpubTocExtractor file -->
     <label for="language-select">Choose a language:</label>
     <select id="language-select">
         <option value="en">English</option>
         <option value="fr">French</option>
         <option value="es">Spanish</option>
     </select>
     <div>
        <input type="file" id="fileInput" accept=".epub"/>
     </div>
     
    <div id="viewer"></div>

    <div id="myModal" class="modal"> 
        <div class="modal-content"> 
            <span class="close">&times;</span> 
            <div class="text-container">
                <p>Selected text will appear here</p>
                <div id="selectedText"></div>
            </div>
            <div id="return_sentence"> this is what you said </div>
            <button id="record">record Button</button>
            <button id="stop">stop Button</button>
            <div class="arrow-container">
                <span class="arrowPrev">Prev</span>
                <span class="arrowNext">Next</span>
            </div>
            
            
            
        </div>

    </div>

    
<div id="navigation">
    <button id="prev">Previous</button>
    <button id="next">Next</button>
    <button id="select">Select this paragraph</button>
    
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    let currentBook = null;
    let rendition = null;
    let selectedText = null;
    let lines = null; 
    let lineNum = 0;

    let mediaRecorder; 
    let audioChunks = []; //buffer

    const modalDiv = document.getElementById('myModal');
    const closeBtn = document.getElementsByClassName('close')[0];
    const selectBtn = document.getElementById('select');
    const selectDiv = document.getElementById('selectedText');
    const prevBtn = document.getElementsByClassName('arrowPrev')[0];
    const nextBtn = document.getElementsByClassName('arrowNext')[0];
    const returnSentenceDiv = document.getElementById('return_sentence');
    
    
    const recordBtn = document.getElementById('record'); 
    const stopBtn = document.getElementById('stop');
    
    const abbreviations = [
        'Mr.', 'Mrs.', 'Ms.', 'Dr.', 'Prof.',
        'Sr.', 'Jr.', 'etc.', 'e.g.', 'i.e.', '."'
    ];
    const socket = new WebSocket('ws://localhost:8765'); //built-in object. url of our socket (its local in this case)

    // WebSocket event handlers
    socket.addEventListener('open', () => {
        console.log('WebSocket connection established'); //a use could be connect it to enable/not the record button
    });

    socket.addEventListener('message', (event) => {
        console.log('Message from server:', event.data); //actual message/data received from the WebSocket server
        const msg = JSON.parse(event.data);

        if (msg.hasOwnProperty('pred_sentence')) {
            returnSentenceDiv.innerHTML = msg.pred_sentence;
        }
        //returnSentenceDiv.textContent = event.data; // Display message from server. ex: "an audio has been received"
    });

    socket.addEventListener('close', () => {
        console.log('WebSocket connection closed');
    });

    socket.addEventListener('error', (error) => {
        console.error('WebSocket error:', error);
    });

    recordBtn.addEventListener('click', async () => { //standarised procedure 
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); //built-in function of mozilla to get the media of the user
        mediaRecorder = new MediaRecorder(stream); //object pre-built

        mediaRecorder.ondataavailable = event => { //event = the object has changed in some way. every ms that you talk and it gets saved in the array
            audioChunks.push(event.data);  //saving the audio into an array
        };

        mediaRecorder.onstop = () => {

            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' }); //standarised object to store the mide. wav is binary
            const reader = new FileReader(); //fileReader instance to manipulate the blob
            reader.onloadend = function() {  //it's like an "instruction for the future". When you have data (blob) and you finish loading, this is what you would have to do 
                // The result will be a data URL, so we split to get the Base64 part
                const base64Blob = reader.result;
                const dataToSend = {
                    name: "John Doe",
                    age: 30,
                    city: "New York",
                    blob:base64Blob,
                    sentence:lines[lineNum]
                };
                const jsonString = JSON.stringify(dataToSend); //turn the json into a string
            
                //socket.send(audioBlob);  //when we just sent the audio recorded, not the json obj
                socket.send(jsonString);
            };

            // Read the audioBlob as a data URL
            reader.readAsDataURL(audioBlob); //when its done, the onloaded event will fire

            audioChunks = [];  //emptying the audio
            
        };

        mediaRecorder.start();
        //socket.send(JSON.stringify({ event: 'start' })); // Notify server that recording has started
    });

    stopBtn.addEventListener('click', () => {
        mediaRecorder.stop();
        //socket.send(JSON.stringify({ event: 'stop' })); // Notify server that recording has stopped
    });

    prevBtn.addEventListener('click', () => {
            if (lineNum <= 0) {
                // Do nothing when at the start
            } else {
                lineNum--;
                selectDiv.innerHTML = lines[lineNum];
            }
        });

        nextBtn.addEventListener('click',() => {
            console.log(`clicked on nextBtn. line number: ${lineNum}`);
            if (lineNum == lines.length-1) {
            
            } else {
                lineNum++;
                selectDiv.innerHTML=lines[lineNum];
            }
            
        })

    selectBtn.addEventListener('click', () => {
        if (!rendition) { 
            alert('Please load an EPUB file first');
            return;
        }
        
        modalDiv.style.display = "block"; //
        //selectDiv.innerHTML=selectedText;
        console.log(selectDiv);
        console.log("finding the lines")
        console.log(lines);
        console.log(lineNum);
        selectDiv.innerHTML=lines[lineNum];

    });

    closeBtn.addEventListener('click', (event) => {
        modalDiv.style.display = "none"; 
        lineNum=0;

    });

    // Close modal when clicking outside
    window.addEventListener('click',(event)=> {
        if (event.target==modalDiv) {
            modalDiv.style.display = "none";
        }
    });

    fileInput.addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (file) {
            currentBook = ePub(file);
            
            rendition = currentBook.renderTo("viewer", {
                width: "100%",
                height: "600px",
                spread: "none",
                allowScriptedContent: true,
                script: true,
                sandbox: "allow-same-origin allow-scripts allow-popups",
                spread: "none"
            });

            // Add the makeRangeCfi function
            const makeRangeCfi = (a, b) => {
                const CFI = new ePub.CFI()
                const start = CFI.parse(a), end = CFI.parse(b)
                const cfi = {
                    range: true,
                    base: start.base,
                    path: {
                        steps: [],
                        terminal: null
                    },
                    start: start.path,
                    end: end.path
                }
                const len = cfi.start.steps.length
                for (let i = 0; i < len; i++) {
                    if (CFI.equalStep(cfi.start.steps[i], cfi.end.steps[i])) {
                        if (i == len - 1) {
                            if (cfi.start.terminal === cfi.end.terminal) {
                                cfi.path.steps.push(cfi.start.steps[i])
                                cfi.range = false
                            }
                        } else cfi.path.steps.push(cfi.start.steps[i])
                    } else break
                }
                cfi.start.steps = cfi.start.steps.slice(cfi.path.steps.length)
                cfi.end.steps = cfi.end.steps.slice(cfi.path.steps.length)

                return 'epubcfi(' + CFI.segmentString(cfi.base)
                    + '!' + CFI.segmentString(cfi.path)
                    + ',' + CFI.segmentString(cfi.start)
                    + ',' + CFI.segmentString(cfi.end)
                    + ')'
            }

            // Function to extract visible text
            const extractVisibleText = () => {
                const location = rendition.currentLocation();
                console.log(location);
                if (location && location.start && location.end) {
                    const [a, b] = [location.start.cfi, location.end.cfi];
                    const rangeCfi = makeRangeCfi(a, b);
                    
                    currentBook.getRange(rangeCfi) //the return of this function is a var called range which has our text
                        .then(range => { //function that is returning range
                            console.log('Current page text:', range.toString());
                            selectedText=range.toString();
                            const  regexMatch =  /[A-Z]\./g
                            selectedText = selectedText.replace(regexMatch, (match) => match.replace('.', ''));
                            for (let i = 0; i < abbreviations.length; i++) {
                                let abbr = abbreviations[i].replaceAll(".", "");
                                selectedText = selectedText.replaceAll(abbreviations[i], abbr);
                            }

                            lines = selectedText.split('.') ; //its returned already because its a global var
                            console.log(lines);
                            
                        })
                        .catch(error => {
                            console.error('Error getting range:', error);
                        });
                }

            };

            // Initial render
            rendition.on('rendered', extractVisibleText);

            // Navigation
            document.getElementById('prev').addEventListener('click', () => {
                rendition.prev().then(extractVisibleText);
            });

            document.getElementById('next').addEventListener('click', () => {
                rendition.next().then(extractVisibleText);
            });

            rendition.display();
        }
    });

    recordBtn.addEventListener('click',() => {

    });
</script>
